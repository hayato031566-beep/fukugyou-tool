<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>eBay利益計算 Pro | 履歴＆コピー機能</title>
  <style>
    :root { --main: #00457C; --accent: #ffae00; --bg: #f0f2f5; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; font-family: sans-serif; background: var(--bg); color: #333; line-height: 1.4; }
    .container { max-width: 500px; margin: 0 auto; padding: 15px; }
    .card { background: #fff; border-radius: 16px; padding: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    h1 { font-size: 18px; text-align: center; margin: 0 0 15px; color: var(--main); }

    /* 2カラムレイアウト（横並び） */
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .field { display: flex; flex-direction: column; }
    label { font-size: 11px; font-weight: bold; margin-bottom: 3px; color: #666; }
    input { padding: 12px; border: 1px solid #ccc; border-radius: 10px; font-size: 16px; width: 100%; outline: none; }
    input:focus { border-color: var(--main); }
    .hint { font-size: 9px; color: #999; margin-top: 2px; }

    /* 結果エリア */
    .result-box { margin-top: 15px; padding: 15px; border-radius: 12px; background: var(--main); color: #fff; }
    .res-item { display: flex; justify-content: space-between; margin-bottom: 4px; font-size: 13px; }
    .res-main { border-top: 1px solid rgba(255,255,255,0.2); padding-top: 8px; margin-top: 8px; font-size: 20px; font-weight: bold; }

    /* ボタン */
    .btn-save { width: 100%; padding: 14px; background: var(--accent); color: #fff; border: none; border-radius: 10px; font-weight: bold; font-size: 16px; margin-top: 15px; cursor: pointer; }
    .btn-reset { width: 100%; background: none; border: none; color: #888; text-decoration: underline; margin-top: 10px; cursor: pointer; font-size: 12px; }

    /* 履歴エリア */
    .history-area { margin-top: 20px; }
    .history-head { font-weight: bold; font-size: 14px; margin-bottom: 8px; display: flex; justify-content: space-between; border-bottom: 2px solid #ddd; padding-bottom: 5px; }
    .history-list { max-height: 200px; overflow-y: auto; }
    .history-card { background: #fff; border-radius: 8px; padding: 10px; margin-bottom: 6px; border: 1px solid #ddd; display: flex; justify-content: space-between; align-items: center; }
    .history-info { font-size: 11px; color: #444; }
    .btn-copy { background: var(--main); color: #fff; border: none; padding: 5px 8px; border-radius: 5px; font-size: 10px; cursor: pointer; }

    .plus { color: #4ade80; }
    .minus { color: #ff6b6b; }
  </style>
</head>
<body>

<div class="container">
  <div class="card">
    <h1>eBay利益計算 Pro</h1>
    
    <div class="form-grid">
      <div class="field">
        <label>売値 (USD)</label>
        <input type="number" id="saleUsd" placeholder="100" inputmode="decimal">
      </div>
      <div class="field">
        <label>為替レート</label>
        <input type="number" id="rate" value="150" inputmode="decimal">
        <span class="hint">目安:150 (Paypalなら-3)</span>
      </div>
      <div class="field">
        <label>仕入れ (円)</label>
        <input type="number" id="cost" placeholder="5000" inputmode="numeric">
      </div>
      <div class="field">
        <label>送料 (円)</label>
        <input type="number" id="shipping" placeholder="2500" inputmode="numeric">
      </div>
      <div class="field">
        <label>eBay手数料 (%)</label>
        <input type="number" id="feePercent" value="15" inputmode="decimal">
        <span class="hint">目安:15〜18%</span>
      </div>
      <div class="field">
        <label>その他経費 (円)</label>
        <input type="number" id="other" placeholder="例:300" inputmode="numeric">
        <span class="hint">梱包材・資材代など</span>
      </div>
    </div>

    <div class="result-box">
      <div class="res-item"><span>円換算売上:</span><span id="salesJpy">¥0</span></div>
      <div class="res-item"><span>手数料合計:</span><span id="feeJpy">¥0</span></div>
      <div class="res-item res-main"><span>純利益:</span><span id="profit">¥0</span></div>
      <div class="res-item"><span>利益率:</span><span id="profitRate">0%</span></div>
    </div>

    <button class="btn-save" onclick="addHistory()">結果を履歴に保存</button>
    <button class="btn-reset" onclick="resetAll()">すべてリセット</button>
  </div>

  <div class="history-area">
    <div class="history-head"><span>計算履歴</span><span id="count">0件</span></div>
    <div id="historyList" class="history-list">
      </div>
  </div>
</div>

<script>
  const ids = ['saleUsd', 'rate', 'cost', 'shipping', 'feePercent', 'other'];
  const inputs = {};
  ids.forEach(id => inputs[id] = document.getElementById(id));

  // 計算処理
  function calc() {
    const val = (id) => parseFloat(inputs[id].value) || 0;
    
    // 売値 * レート = 総売上
    const salesJpy = val('saleUsd') * val('rate');
    // 売上 * 手数料% = 手数料額（これで売値が高いのに赤字になるミスを防ぐ！）
    const feeJpy = salesJpy * (val('feePercent') / 100);
    // 全コスト合算
    const totalCost = val('cost') + val('shipping') + val('other') + feeJpy;
    // 利益
    const profit = salesJpy - totalCost;
    const pRate = salesJpy > 0 ? (profit / salesJpy) * 100 : 0;

    // 画面に表示
    document.getElementById('salesJpy').textContent = '¥' + Math.round(salesJpy).toLocaleString();
    document.getElementById('feeJpy').textContent = '¥' + Math.round(feeJpy).toLocaleString();
    
    const pEl = document.getElementById('profit');
    pEl.textContent = '¥' + Math.round(profit).toLocaleString();
    pEl.className = 'res-main ' + (profit >= 0 ? 'plus' : 'minus');
    
    document.getElementById('profitRate').textContent = pRate.toFixed(1) + '%';
  }

  // 入力するたびにリアルタイム計算
  ids.forEach(id => inputs[id].addEventListener('input', calc));

  // 履歴に追加
  function addHistory() {
    const sale = inputs.saleUsd.value || 0;
    const profit = document.getElementById('profit').textContent;
    const pRate = document.getElementById('profitRate').textContent;
    if(sale == 0) return;

    const time = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
    const logText = `【${time}】売$${sale} / 利益${profit}(${pRate})`;

    const div = document.createElement('div');
    div.className = 'history-card';
    div.innerHTML = `
      <div class="history-info">${logText}</div>
      <button class="btn-copy" onclick="copy('${logText}')">コピー</button>
    `;
    
    const list = document.getElementById('historyList');
    list.prepend(div); // 上に新しく追加
    document.getElementById('count').textContent = list.children.length + '件';
  }

  // コピー機能
  function copy(text) {
    navigator.clipboard.writeText(text).then(() => {
      alert('コピーしました！');
    });
  }

  // リセット
  function resetAll() {
    if(confirm('入力をクリアしますか？')) {
      ids.forEach(id => {
        if(id === 'rate') inputs[id].value = 150;
        else if(id === 'feePercent') inputs[id].value = 15;
        else inputs[id].value = '';
      });
      calc();
    }
  }
</script>

</body>
</html>
