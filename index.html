<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>eBay Profit Manager Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:        #f9f7f2;
      --bg2:       #f3efe8;
      --surface:   #ffffff;
      --border:    #e8e4dc;
      --border-f:  #d4cfc5;
      --ink:       #1a1714;
      --ink2:      #5c5248;
      --ink3:      #9c9080;
      --terra:     #c0593a;
      --terra-h:   #a8492e;
      --terra-l:   #f7ede8;
      --green:     #2a7048;
      --green-l:   #eaf3ee;
      --red:       #b03838;
      --red-l:     #faeaea;
      --r:         14px;
      --r-sm:      9px;
      --r-xs:      6px;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
    body {
      margin: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-weight: 400;
      background: var(--bg);
      color: var(--ink);
      overflow-x: hidden;
      min-height: 100dvh;
      -webkit-font-smoothing: antialiased;
    }

    /* Header */
    .header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 15px 22px;
      display: flex;
      align-items: center;
      gap: 10px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .logo-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--terra); }
    .header-wordmark { font-size: 15px; font-weight: 500; color: var(--ink); letter-spacing: -0.02em; }
    .header-sep { width: 1px; height: 14px; background: var(--border); }
    .header-sub { font-size: 12px; color: var(--ink3); }

    /* Tabs */
    .tabs { display: flex; background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 20px; }
    .tab {
      padding: 11px 14px 9px; color: var(--ink3); cursor: pointer;
      font-size: 13px; font-weight: 400; letter-spacing: 0.005em;
      border-bottom: 1.5px solid transparent; margin-bottom: -1px;
      transition: color 0.15s, border-color 0.15s;
    }
    .tab.active { color: var(--terra); border-bottom-color: var(--terra); font-weight: 500; }

    /* Layout */
    .container { width: 100%; max-width: 480px; margin: 0 auto; padding: 24px 18px 52px; }
    .page { display: none; }
    .page.active { display: block; }

    /* Cards */
    .card { background: var(--surface); border-radius: var(--r); padding: 24px; border: 1px solid var(--border); margin-bottom: 12px; }
    .card-label {
      font-size: 10px; font-weight: 500; letter-spacing: 0.10em; text-transform: uppercase;
      color: var(--ink3); margin: 0 0 20px; display: flex; align-items: center; gap: 7px;
    }
    .card-label svg { opacity: 0.45; flex-shrink: 0; }

    /* Form */
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .field { display: flex; flex-direction: column; }
    .field.full { grid-column: 1 / 3; }
    label { font-size: 10.5px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink3); margin-bottom: 7px; }
    input {
      padding: 11px 13px;
      border: 1px solid #e5e5e5;
      border-radius: var(--r-sm);
      font-size: 15px; font-family: 'Inter', sans-serif; font-weight: 400;
      color: var(--ink); background: var(--bg); width: 100%;
      transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
      -webkit-appearance: none;
    }
    input::placeholder { color: var(--ink3); opacity: 0.55; }
    input:focus { border-color: var(--terra); background: var(--surface); box-shadow: 0 0 0 3px rgba(192,89,58,0.10); }

    .field-divider { grid-column: 1/3; border: none; border-top: 1px solid var(--border); margin: 2px 0; }

    /* Quick btns */
    .quick-group { display: flex; gap: 5px; margin-top: 7px; }
    .q-btn {
      flex: 1; background: var(--bg2); border: 1px solid var(--border);
      padding: 7px 4px; border-radius: var(--r-xs);
      font-size: 10.5px; font-weight: 500; color: var(--ink2);
      cursor: pointer; font-family: 'Inter', sans-serif;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .q-btn:hover { background: var(--terra-l); border-color: rgba(192,89,58,0.25); color: var(--terra-h); }

    /* Back-calc */
    .btn-toggle {
      width: 100%; padding: 11px; background: transparent;
      border: 1px dashed var(--border-f); border-radius: var(--r-sm);
      font-size: 12px; font-weight: 400; color: var(--ink3); margin-top: 18px;
      cursor: pointer; font-family: 'Inter', sans-serif;
      display: flex; align-items: center; justify-content: center; gap: 7px;
    }
    #backCalcPanel { display: none; background: var(--terra-l); border: 1px solid rgba(192,89,58,0.15); padding: 18px; border-radius: var(--r-sm); margin-top: 10px; }
    .backcalc-row { display: flex; gap: 8px; margin-top: 8px; }
    .btn-exec { background: var(--terra); color: #fff; border: none; border-radius: var(--r-sm); padding: 0 18px; font-size: 13px; font-weight: 500; cursor: pointer; }

    /* Result box */
    .result-box {
      background: var(--ink); color: #fff; border-radius: var(--r);
      padding: 26px 24px 22px; text-align: center; margin-top: 6px;
      border: 1px solid rgba(0,0,0,0.08); position: relative; overflow: hidden;
    }
    #profit { font-size: 44px; font-weight: 300; letter-spacing: -0.04em; line-height: 1; margin: 0 0 6px; }
    .profit-positive { color: #6ddbaa; }
    .profit-negative { color: #ff8c8c; }

    .btn-save {
      width: 100%; padding: 14px; background: var(--terra); color: #fff; border: none;
      border-radius: var(--r-sm); font-weight: 500; font-size: 14px; margin-top: 12px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-reset { width: 100%; background: none; border: none; color: var(--ink3); margin-top: 14px; font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }

    /* History & Report */
    .report-hero { background: var(--ink); color: #fff; border-radius: var(--r); padding: 24px; margin-bottom: 12px; }
    #monthTotal { font-size: 46px; font-weight: 300; margin: 2px 0 14px; }
    .bar-bg { background: rgba(255,255,255,0.10); height: 3px; border-radius: 2px; }
    .bar-fill { background: var(--terra); height: 100%; width: 0%; transition: width 0.6s; }
    .hist-card { background: var(--surface); padding: 14px 16px; border-radius: var(--r-sm); margin-bottom: 6px; border: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .hist-profit.pos { color: var(--green); font-weight: 500; }
    .hist-profit.neg { color: var(--red); font-weight: 500; }

    #toast { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 20px; border-radius: 24px; font-size: 12.5px; display: none; z-index: 1000; }
  </style>
</head>
<body>

<div id="toast"></div>

<div class="header">
  <div class="logo-dot"></div>
  <span class="header-wordmark">Profit Manager</span>
  <div class="header-sep"></div>
  <span class="header-sub">eBay Export</span>
</div>

<div class="tabs">
  <div class="tab active" id="tab-calc" onclick="switchTab('calcPage')">利益計算</div>
  <div class="tab" id="tab-report" onclick="switchTab('reportPage')">集計レポート</div>
</div>

<div class="container">

  <div id="calcPage" class="page active">

    <div class="card">
      <div class="card-label">商品情報</div>
      <div class="field">
        <label>商品メモ</label>
        <input type="text" id="itemName" placeholder="例：Game Console, Anime Figureなど">
      </div>
    </div>

    <div class="card">
      <div class="card-label">取引パラメータ</div>
      <div class="form-grid">
        <div class="field">
          <label>為替レート (¥/$)</label>
          <input type="number" id="rate" value="150">
        </div>
        <div class="field">
          <label>eBay 手数料 (%)</label>
          <input type="number" id="feePercent" value="15">
        </div>
        <hr class="field-divider">
        <div class="field">
          <label>売値 (USD)</label>
          <input type="number" id="saleUsd" placeholder="0.00">
        </div>
        <div class="field">
          <label>仕入れ値 (円)</label>
          <input type="number" id="cost" placeholder="0">
        </div>
        <div class="field">
          <label>送料 (USD) ※ドル入力</label>
          <input type="number" id="shippingUsd" placeholder="0.00">
          <div class="quick-group">
            <button class="q-btn" onclick="setShippingUsd(20)">FedEx $20</button>
            <button class="q-btn" onclick="setShippingUsd(35)">EMS $35</button>
          </div>
        </div>
        <div class="field">
          <label>その他費用 (円)</label>
          <input type="number" id="other" value="0">
        </div>
      </div>

      <button class="btn-toggle" onclick="toggleBackCalc()">逆算モード — 希望利益(円)から売値を出す</button>
      <div id="backCalcPanel">
        <label>希望の純利益 (円)</label>
        <div class="backcalc-row">
          <input type="number" id="targetProfit" value="3000">
          <button class="btn-exec" onclick="calcBack()">計算</button>
        </div>
      </div>
    </div>

    <div class="result-box">
      <div id="profit">¥0</div>
      <div style="font-size:12px; opacity:0.6;">利益率: <span id="profitRate">0%</span></div>
    </div>

    <button class="btn-save" onclick="saveRecord()">この利益を記録する</button>
    <button class="btn-reset" onclick="resetInputs()">リセット</button>
  </div>

  <div id="reportPage" class="page">
    <div class="report-hero">
      <span style="font-size:10px; opacity:0.5;">累計利益</span>
      <div id="monthTotal">¥0</div>
      <div class="bar-bg"><div id="goalBar" class="bar-fill"></div></div>
    </div>
    <div id="historyList"></div>
  </div>

</div>

<script>
  const ids = ['itemName','rate','feePercent','saleUsd','cost','shippingUsd','other'];
  const inputs = {};
  ids.forEach(id => inputs[id] = document.getElementById(id));

  window.onload = () => {
    inputs.rate.value = localStorage.getItem('cfg_rate') || 150;
    inputs.feePercent.value = localStorage.getItem('cfg_fee') || 15;
    updateReport();
  };

  function switchTab(pId) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.getElementById(pId).classList.add('active');
    document.getElementById(pId === 'calcPage' ? 'tab-calc' : 'tab-report').classList.add('active');
    if (pId === 'reportPage') updateReport();
  }

  function setShippingUsd(v) { inputs.shippingUsd.value = v; calc(); }

  function toggleBackCalc() {
    const p = document.getElementById('backCalcPanel');
    p.style.display = p.style.display === 'block' ? 'none' : 'block';
  }

  function calc() {
    const val = id => parseFloat(inputs[id].value) || 0;
    const rate = val('rate');
    const feeP = val('feePercent') / 100;
    
    const saleJpy = val('saleUsd') * rate;
    const shipJpy = val('shippingUsd') * rate;
    const feeJpy = saleJpy * feeP;
    
    const profit = saleJpy - (val('cost') + shipJpy + val('other') + feeJpy);
    const pRate = saleJpy > 0 ? (profit / saleJpy) * 100 : 0;

    const pEl = document.getElementById('profit');
    pEl.textContent = (profit >= 0 ? '¥' : '-¥') + Math.abs(Math.round(profit)).toLocaleString();
    pEl.className = profit >= 0 ? 'profit-positive' : 'profit-negative';
    document.getElementById('profitRate').textContent = pRate.toFixed(1) + '%';
  }
  ids.forEach(id => inputs[id].addEventListener('input', calc));

  function calcBack() {
    const target = parseFloat(document.getElementById('targetProfit').value) || 0;
    const val = id => parseFloat(inputs[id].value) || 0;
    const rate = val('rate'), fP = val('feePercent') / 100;
    if (rate <= 0) return;
    
    // 逆算ロジック: 売値USD = (希望利益 + 仕入れ円 + その他円) / (レート * (1 - 手数料)) + 送料USD
    const neededusd = (target + val('cost') + val('other')) / (rate * (1 - fP)) + val('shippingUsd');
    inputs.saleUsd.value = Math.ceil(neededusd);
    calc();
    showToast('売値を更新しました');
  }

  function saveRecord() {
    if (!inputs.saleUsd.value) return showToast('値を入力してください');
    calc();
    const pText = document.getElementById('profit').textContent;
    const profit = parseInt(pText.replace(/[¥,]/g, '')) * (pText.startsWith('-') ? -1 : 1);
    const record = { id: Date.now(), name: inputs.itemName.value || 'No Title', sale: inputs.saleUsd.value, profit };
    let data = JSON.parse(localStorage.getItem('ebay_pro_data') || '[]');
    data.unshift(record);
    localStorage.setItem('ebay_pro_data', JSON.stringify(data));
    showToast('保存しました');
  }

  function updateReport() {
    const data = JSON.parse(localStorage.getItem('ebay_pro_data') || '[]');
    let total = 0;
    const list = document.getElementById('historyList');
    list.innerHTML = '';
    data.forEach(item => {
      total += item.profit;
      const div = document.createElement('div');
      div.className = 'hist-card';
      div.innerHTML = `<div>${item.name}<br><small>$${item.sale}</small></div><div class="hist-profit ${item.profit>=0?'pos':'neg'}">¥${item.profit.toLocaleString()}</div>`;
      list.appendChild(div);
    });
    document.getElementById('monthTotal').textContent = '¥' + total.toLocaleString();
  }

  function resetInputs() {
    ['itemName','saleUsd','cost','shippingUsd','other'].forEach(id => inputs[id].value = (id==='other'?0:''));
    calc();
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.style.display = 'block';
    setTimeout(() => t.style.display = 'none', 2000);
  }
</script>
</body>
</html>
