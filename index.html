<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>eBay Profit Manager Pro+</title>
  <style>
    :root { --main: #00457C; --accent: #ffae00; --bg: #f0f2f5; --white: #ffffff; --green: #28a745; --red: #dc3545; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
    body { margin: 0; font-family: -apple-system, sans-serif; background: var(--bg); color: #333; overflow-x: hidden; }
    
    .header { background: var(--main); color: #fff; padding: 10px; text-align: center; font-weight: bold; position: sticky; top: 0; z-index: 100; font-size: 15px; }
    .tabs { display: flex; background: var(--main); }
    .tab { flex: 1; padding: 12px; text-align: center; color: rgba(255,255,255,0.6); cursor: pointer; font-size: 13px; font-weight: bold; }
    .tab.active { color: #fff; border-bottom: 4px solid var(--accent); }

    .container { width: 100%; max-width: 500px; margin: 0 auto; padding: 8px; }
    .page { display: none; }
    .page.active { display: block; }

    .card { background: var(--white); border-radius: 12px; padding: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 8px; }
    h2 { font-size: 12px; margin: 0 0 8px; color: var(--main); border-left: 4px solid var(--accent); padding-left: 8px; }

    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .field { display: flex; flex-direction: column; margin-bottom: 3px; }
    .field.full { grid-column: 1 / 3; }
    label { font-size: 9px; font-weight: bold; margin-bottom: 2px; color: #777; }
    input { padding: 8px; border: 1px solid #ddd; border-radius: 6px; font-size: 15px; width: 100%; }
    
    .quick-group { display: flex; gap: 3px; margin-top: 3px; }
    .q-btn { flex: 1; background: #f0f0f0; border: none; padding: 4px; border-radius: 4px; font-size: 9px; color: #555; }

    .result-box { background: var(--main); color: #fff; border-radius: 12px; padding: 12px; text-align: center; margin-top: 5px; }
    .res-row { display: flex; justify-content: space-between; font-size: 10px; opacity: 0.9; margin-bottom: 1px; }
    #profit { font-size: 26px; font-weight: bold; margin: 3px 0; }

    .btn-toggle { width: 100%; padding: 6px; background: #eee; border: none; border-radius: 6px; font-size: 10px; color: #666; margin-top: 8px; }
    #backCalcPanel { display: none; background: #fffde7; border: 1px dashed var(--accent); padding: 10px; border-radius: 8px; margin-top: 8px; }

    .sum-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 8px 0; }
    .sum-item { background: #f8f9fa; padding: 8px; border-radius: 8px; text-align: center; cursor: pointer; border: 2px solid transparent; }
    .sum-item:active { background: #eee; }
    .sum-item.active-filter { border-color: var(--main); background: #fff; }

    .bar-bg { background: #eee; height: 6px; border-radius: 3px; overflow: hidden; margin: 4px 0; }
    .bar-fill { background: var(--green); height: 100%; width: 0%; transition: 0.5s; }

    .btn-save { width: 100%; padding: 14px; background: var(--accent); color: #fff; border: none; border-radius: 10px; font-weight: bold; font-size: 16px; margin-top: 8px; box-shadow: 0 4px 0 #d48a00; }
    .btn-reset { width: 100%; background: none; border: none; color: #999; text-decoration: underline; margin-top: 10px; font-size: 10px; }

    .hist-card { background: #fff; padding: 8px; border-radius: 8px; margin-bottom: 4px; border: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; font-size: 11px; }
    .hist-del { color: var(--red); background: none; border: none; font-size: 16px; padding: 0 4px; }

    #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: #fff; padding: 8px 16px; border-radius: 16px; font-size: 11px; display: none; z-index: 1000; }
  </style>
</head>
<body>

<div id="toast"></div>
<div class="header">eBay Profit Manager Pro+</div>

<div class="tabs">
  <div class="tab active" id="tab-calc" onclick="switchTab('calcPage')">利益計算</div>
  <div class="tab" id="tab-report" onclick="switchTab('reportPage')">集計レポート</div>
</div>

<div class="container">
  <div id="calcPage" class="page active">
    <div class="card">
      <div class="field full">
        <label>商品メモ</label>
        <input type="text" id="itemName" placeholder="例：キヤノン EOS R6">
      </div>
      <div class="form-grid" style="margin-top:8px;">
        <div class="field"><label>為替(¥/$)</label><input type="number" id="rate" value="150"></div>
        <div class="field"><label>eBay手数料(%)</label><input type="number" id="feePercent" value="15"></div>
        <div class="field"><label>広告費(%) ※3.1推奨</label><input type="number" id="adPercent" value="3.1"></div>
        <div class="field"><label>売値(USD)</label><input type="number" id="saleUsd" placeholder="0"></div>
        <div class="field"><label>仕入(円)</label><input type="number" id="cost" placeholder="0"></div>
        <div class="field">
          <label>送料(円)</label>
          <input type="number" id="shipping" placeholder="0">
          <div class="quick-group">
            <button class="q-btn" onclick="setShipping(3000)">FedEx</button>
            <button class="q-btn" onclick="setShipping(5000)">EMS</button>
          </div>
        </div>
        <div class="field"><label>他経費(円)</label><input type="number" id="other" value="0"></div>
      </div>

      <button class="btn-toggle" onclick="toggleBackCalc()">▼ 利益から売値を逆算する</button>
      <div id="backCalcPanel">
        <label>希望の純利益 (円)</label>
        <div style="display:flex; gap:6px; margin-top:4px;">
          <input type="number" id="targetProfit" value="3000" style="flex:1;">
          <button onclick="calcBack()" style="background:var(--main); color:#fff; border:none; border-radius:6px; padding:0 10px; font-size:11px;">実行</button>
        </div>
      </div>
    </div>

    <div class="result-box">
      <div class="res-row"><span>売上: <span id="salesJpy">¥0</span></span><span>手数料+広告: <span id="feeJpy">¥0</span></span></div>
      <div id="profit">¥0</div>
      <div style="font-size:10px;">利益率: <span id="profitRate">0%</span></div>
    </div>

    <button class="btn-save" onclick="saveRecord()">利益を保存する</button>
    <button class="btn-reset" onclick="resetInputs()">入力をリセット</button>
  </div>

  <div id="reportPage" class="page">
    <div class="card">
      <h2 style="display:flex; justify-content:space-between; align-items:center;">
        📈 今月の進捗 
        <button class="q-btn" style="padding: 1px 6px;" onclick="setGoal()">目標設定</button>
      </h2>
      <div style="display:flex; justify-content:space-between; font-size:10px;">
        <span id="goalText">目標: ¥100,000</span>
        <span id="percentText">0%</span>
      </div>
      <div class="bar-bg"><div id="goalBar" class="bar-fill"></div></div>
      <div id="monthTotal" style="font-size:20px; font-weight:bold; color:var(--main); text-align:center; cursor:pointer;" onclick="updateReport('all')">¥0</div>
      <div style="font-size:8px; text-align:center; color:#888; margin-top:-2px;">(タップで全件表示)</div>
      
      <div class="sum-grid">
        <div class="sum-item" id="filter-plus" onclick="updateReport('plus')"><div style="font-size:9px; color:var(--green);">黒字件数</div><b id="plusCount" style="font-size:16px;">0</b></div>
        <div class="sum-item" id="filter-minus" onclick="updateReport('minus')"><div style="font-size:9px; color:var(--red);">赤字件数</div><b id="minusCount" style="font-size:16px;">0</b></div>
      </div>
      <div style="font-size:9px; text-align:center; color:#666;">※件数をタップして履歴を絞り込み</div>
    </div>
    <div id="historyList"></div>
    <button class="btn-reset" style="color:var(--red); width:100%;" onclick="clearAllData()">データを全削除</button>
  </div>
</div>

<script>
  // 共通のデータ管理
  const ids = ['itemName', 'rate', 'feePercent', 'adPercent', 'saleUsd', 'cost', 'shipping', 'other'];
  const inputs = {};
  ids.forEach(id => inputs[id] = document.getElementById(id));

  // 初回読み込み
  window.onload = () => {
    inputs.rate.value = localStorage.getItem('cfg_rate') || 150;
    inputs.feePercent.value = localStorage.getItem('cfg_fee') || 15;
    inputs.adPercent.value = localStorage.getItem('cfg_ad') || 3.1;
    updateReport();
  };

  function switchTab(pId) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.getElementById(pId).classList.add('active');
    document.getElementById(pId === 'calcPage' ? 'tab-calc' : 'tab-report').classList.add('active');
    if(pId === 'reportPage') updateReport('all'); // 集計を開くときは全件表示
  }

  function setShipping(v) { inputs.shipping.value = v; calc(); }
  function toggleBackCalc() { 
    const p = document.getElementById('backCalcPanel');
    p.style.display = p.style.display === 'block' ? 'none' : 'block';
  }

  // --- 計算ロジック (広告費追加) ---
  function calc() {
    const val = (id) => parseFloat(inputs[id].value) || 0;
    // 設定を保存
    localStorage.setItem('cfg_rate', inputs.rate.value);
    localStorage.setItem('cfg_fee', inputs.feePercent.value);
    localStorage.setItem('cfg_ad', inputs.adPercent.value);

    const sJpy = Math.round(val('saleUsd') * val('rate'));
    
    // 【修正】手数料と広告費の両方を計算
    const feeJpy = Math.round(sJpy * (val('feePercent') / 100));
    const adJpy = Math.round(sJpy * (val('adPercent') / 100));
    const totalFees = feeJpy + adJpy;

    const profit = sJpy - (val('cost') + val('shipping') + val('other') + totalFees);
    const pRate = sJpy > 0 ? (profit / sJpy) * 100 : 0;

    document.getElementById('salesJpy').textContent = '¥' + sJpy.toLocaleString();
    document.getElementById('feeJpy').textContent = '¥' + totalFees.toLocaleString();
    const pEl = document.getElementById('profit');
    pEl.textContent = (profit >= 0 ? '¥' : '-¥') + Math.abs(profit).toLocaleString();
    pEl.style.color = profit >= 0 ? 'var(--green)' : 'var(--red)';
    document.getElementById('profitRate').textContent = pRate.toFixed(1) + '%';
  }
  ids.forEach(id => inputs[id].addEventListener('input', calc));

  // --- 逆算ロジック (広告費対応) ---
  function calcBack() {
    const target = parseFloat(document.getElementById('targetProfit').value) || 0;
    const val = (id) => parseFloat(inputs[id].value) || 0;
    const rate = val('rate');
    const fP = val('feePercent') / 100;
    const aP = val('adPercent') / 100; // 広告費も考慮

    if(rate <= 0) return;
    // 公式: (利益 + 仕入 + 送料 + 他) / (レート * (1 - 手数料率 - 広告費率))
    const res = (target + val('cost') + val('shipping') + val('other')) / (rate * (1 - fP - aP));
    inputs.saleUsd.value = Math.ceil(res);
    calc();
    showToast('広告費込みで売値をセットしました');
  }

  function saveRecord() {
    if(!inputs.saleUsd.value) return showToast('売値を入力してください');
    const profitText = document.getElementById('profit').textContent.replace(/[¥,]/g, '');
    const profit = parseInt(profitText);

    const record = { 
      id: Date.now(), 
      name: inputs.itemName.value || '無題の商品', 
      sale: inputs.saleUsd.value, 
      profit: profit, 
      date: new Date().toISOString() 
    };

    let data = JSON.parse(localStorage.getItem('ebay_pro_data') || '[]');
    data.unshift(record);
    localStorage.setItem('ebay_pro_data', JSON.stringify(data));
    showToast('保存しました！');
  }

  // --- レポートロジック (絞り込み機能追加) ---
  function updateReport(filter = 'all') {
    const data = JSON.parse(localStorage.getItem('ebay_pro_data') || '[]');
    const goal = parseInt(localStorage.getItem('cfg_goal') || 100000);
    let mSum = 0, pCount = 0, mCount = 0;

    const listEl = document.getElementById('historyList');
    listEl.innerHTML = '';

    // フィルター状態の見た目を更新
    document.getElementById('filter-plus').classList.remove('active-filter');
    document.getElementById('filter-minus').classList.remove('active-filter');
    if(filter === 'plus') document.getElementById('filter-plus').classList.add('active-filter');
    if(filter === 'minus') document.getElementById('filter-minus').classList.add('active-filter');

    data.forEach(item => {
      // 集計は常に全件で行う
      mSum += item.profit;
      if(item.profit >= 0) pCount++; else mCount++;

      // 履歴の表示だけを絞り込む
      let show = false;
      if(filter === 'all') show = true;
      if(filter === 'plus' && item.profit >= 0) show = true;
      if(filter === 'minus' && item.profit < 0) show = true;

      if(show) {
        const div = document.createElement('div');
        div.className = 'hist-card';
        div.innerHTML = `<div><b>${item.name}</b><br><small>$${item.sale}</small></div>
                         <div style="display:flex;align-items:center;"><b style="color:${item.profit>=0?'var(--green)':'var(--red)'}">¥${item.profit.toLocaleString()}</b>
                         <button class="hist-del" onclick="deleteItem(${item.id})">×</button></div>`;
        listEl.appendChild(div);
      }
    });

    // 数値を画面に反映
    document.getElementById('monthTotal').textContent = '¥' + mSum.toLocaleString();
    document.getElementById('plusCount').textContent = pCount;
    document.getElementById('minusCount').textContent = mCount;
    document.getElementById('goalText').textContent = '目標: ¥' + goal.toLocaleString();

    // バーの更新
    const per = Math.min(100, Math.max(0, Math.round((mSum / goal) * 100)));
    document.getElementById('goalBar').style.width = per + '%';
    document.getElementById('percentText').textContent = per + '%';
  }

  function deleteItem(id) {
    if(!confirm('この履歴を削除しますか？')) return;
    let data = JSON.parse(localStorage.getItem('ebay_pro_data') || '[]');
    data = data.filter(i => i.id !== id);
    localStorage.setItem('ebay_pro_data', JSON.stringify(data));
    // 現在のフィルター状態を維持して更新
    const activeFilter = document.querySelector('.active-filter') ? document.querySelector('.active-filter').id.replace('filter-', '') : 'all';
    updateReport(activeFilter);
  }

  function setGoal() {
    const g = prompt('目標利益を入力 (円)', '100000');
    if(g) { localStorage.setItem('cfg_goal', g); updateReport(); }
  }

  function resetInputs() {
    ['itemName', 'saleUsd', 'cost', 'shipping', 'other'].forEach(id => inputs[id].value = (id==='other' ? 0 : ''));
    calc();
  }

  function clearAllData() { if(confirm('履歴をすべて削除しますか？')) { localStorage.removeItem('ebay_pro_data'); updateReport(); } }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.style.display = 'block';
    setTimeout(() => t.style.display = 'none', 2000);
  }
</script>
</body>
</html>
