<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>eBay利益で、デルベイ！</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    /* 原因だった「manifest.json」の読み込みを完全に排除し、
        PCでもスマホでも「中央寄せ」を強制するスタイルのみに絞っています。
    */
    :root {
      --main:    #c0593a;
      --main-h:  #a4472b;
      --main-l:  #f8ece6;
      --accent:  #c0593a;
      --bg:      #f9f7f2;
      --bg2:      #f2ede5;
      --surface: #ffffff;
      --border:  #e8e3db;
      --ink:      #18150f;
      --ink2:    #574e43;
      --ink3:    #9a8e80;
      --green:    #1a9e5c;
      --green-l: #e4f7ee;
      --red:      #d03a3a;
      --red-l:    #fceaea;
      --dollar-bg:  #edf7f2;
      --dollar-bd:  #b8dece;
      --dollar-txt: #1a7f50;
      --yen-bg:      #fef6ea;
      --yen-bd:      #f0d9b0;
      --yen-txt:    #9a6010;
      --r:    14px;
      --r-sm: 10px;
      --r-xs:  6px;
      --r-lg: 20px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--ink);
      /* 全体を中央に寄せるための必須設定 */
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* 入力欄の数字の横にある矢印を消す */
    input::-webkit-outer-spin-button,
    input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; }

    /* ── Header (横幅を固定して中央へ) ── */
    .header {
      width: 100%;
      max-width: 500px;
      background: var(--ink);
      padding: 13px 18px 11px;
      display: flex; align-items: center; gap: 11px;
      position: sticky; top: 0; z-index: 100;
    }
    .hd-logo {
      width: 32px; height: 32px; background: var(--main);
      border-radius: 9px; display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .hd-text { flex: 1; }
    .hd-name { font-size: 15px; font-weight: 600; color: #fff; line-height: 1.15; }
    .hd-name span { color: var(--main); }
    .hd-sub { font-size: 9.5px; color: rgba(255,255,255,0.35); margin-top: 1px; }
    .hd-rate {
      font-size: 11px; color: rgba(255,255,255,0.55);
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12);
      border-radius: 20px; padding: 4px 10px;
      display: flex; align-items: center; gap: 5px;
    }
    .hd-dot { width: 5px; height: 5px; border-radius: 50%; background: #2ecc71; }

    /* ── Tabs (中央寄せ) ── */
    .tabs {
      width: 100%;
      max-width: 500px;
      display: flex; background: var(--ink);
      border-bottom: 1px solid rgba(255,255,255,0.07);
      padding: 0 18px;
    }
    .tab {
      flex: 1; padding: 12px 0; text-align: center;
      color: rgba(255,255,255,0.35); cursor: pointer;
      font-size: 13px; border-bottom: 2px solid transparent;
    }
    .tab.active { color: #fff; border-bottom-color: var(--main); font-weight: 600; }

    /* ── Layout ── */
    .container { 
      width: 100%; 
      max-width: 500px; 
      padding: 18px 14px 60px; 
      margin: 0 auto; /* PCでの中央寄せ */
    }
    .page { display: none; }
    .page.active { display: block; }

    /* ── Result box ── */
    .result-box {
      background: var(--ink); color: #fff;
      border-radius: var(--r-lg); padding: 25px 20px;
      text-align: center; margin-bottom: 20px;
    }
    #profit { font-size: 58px; font-weight: 300; margin: 5px 0; }
    .res-row { display: flex; justify-content: space-between; font-size: 11px; color: rgba(255,255,255,0.45); }
    .res-actions { display: flex; gap: 10px; margin-top: 15px; }
    .btn-save { flex: 2; padding: 14px; background: var(--main); color: #fff; border: none; border-radius: var(--r-sm); font-weight: 600; cursor: pointer; }
    .btn-reset-top { flex: 1; padding: 14px; background: rgba(255,255,255,0.1); color: #fff; border: none; border-radius: var(--r-sm); cursor: pointer; }

    /* ── Cards & Forms ── */
    .card { background: var(--surface); border-radius: var(--r-lg); border: 1px solid var(--border); margin-bottom: 12px; overflow: hidden; }
    h2 { font-size: 11px; color: var(--ink3); padding: 15px 18px 5px; margin: 0; display: flex; align-items: center; gap: 8px; }
    h2::before { content: ''; width: 3px; height: 12px; background: var(--main); border-radius: 2px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 15px 18px; }
    .field { display: flex; flex-direction: column; }
    .field.full { grid-column: 1 / 3; }
    label { font-size: 10px; font-weight: 600; color: var(--ink3); margin-bottom: 6px; }

    /* 全ての入力欄を中央揃えにする */
    input {
      width: 100%; padding: 12px; border: 1px solid #e5e5e5; border-radius: var(--r-sm);
      font-size: 16px; background: var(--bg); text-align: center !important;
    }
    .iw { display: flex; }
    .cb { 
      min-width: 40px; display: flex; align-items: center; justify-content: center; 
      font-weight: 700; border: 1px solid; border-right: none; border-radius: var(--r-sm) 0 0 var(--r-sm);
    }
    .cb.y { background: var(--yen-bg); border-color: var(--yen-bd); color: var(--yen-txt); }
    .cb.d { background: var(--dollar-bg); border-color: var(--dollar-bd); color: var(--dollar-txt); }
    .cb.p { background: var(--bg2); border-color: var(--border); color: var(--ink3); }
    .iw input { border-radius: 0 var(--r-sm) var(--r-sm) 0; border-left: none; }

    /* その他パーツ */
    .q-btn { flex: 1; background: var(--bg2); border: 1px solid var(--border); padding: 8px; border-radius: var(--r-sm); cursor: pointer; font-size: 11px; }
    .btn-toggle { width: calc(100% - 36px); margin: 0 18px 15px; padding: 12px; background: var(--bg2); border: 1px dashed var(--border); border-radius: var(--r-sm); cursor: pointer; font-size: 12px; }
    #backCalcPanel { display: none; background: var(--main-l); padding: 15px; border-top: 1px solid var(--border); }
    
    /* レポート */
    .report-hero { background: var(--ink); color: #fff; border-radius: var(--r-lg); padding: 25px; text-align: center; }
    #monthTotal { font-size: 48px; font-weight: 300; margin: 10px 0; }
    .bar-bg { background: rgba(255,255,255,0.1); height: 10px; border-radius: 5px; margin: 10px 0; }
    .bar-fill { height: 100%; background: var(--main); width: 0%; transition: 0.5s; border-radius: 5px; }
    .hist-card { background: #fff; padding: 15px; border-radius: var(--r-sm); border: 1px solid var(--border); margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
    #toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #333; color: #fff; padding: 10px 20px; border-radius: 30px; display: none; }
  </style>
</head>
<body>

<div id="toast"></div>

<div class="header">
  <div class="hd-logo">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
  </div>
  <div class="hd-text">
    <div class="hd-name">eBay利益で、<span>デルベイ！</span></div>
    <div class="hd-sub">eBay輸出 利益計算ツール</div>
  </div>
  <div class="hd-rate"><div class="hd-dot"></div><span id="rateDisplay">¥150/$</span></div>
</div>

<div class="tabs">
  <div class="tab active" id="tab-calc" onclick="switchTab('calcPage')">利益計算</div>
  <div class="tab" id="tab-report" onclick="switchTab('reportPage')">集計レポート</div>
</div>

<div class="container">
  <div id="calcPage" class="page active">
    <div class="card">
      <h2>商品メモ</h2>
      <div class="form-grid">
        <div class="field full"><input type="text" id="itemName" placeholder="商品名を入力"></div>
      </div>
    </div>

    <div class="card">
      <h2>取引情報を入力</h2>
      <div class="form-grid">
        <div class="field"><label>為替レート</label><div class="iw"><div class="cb y">¥</div><input type="number" id="rate" value="150"></div></div>
        <div class="field"><label>eBay手数料 (%)</label><div class="iw"><div class="cb p">%</div><input type="number" id="feePercent" value="15"></div></div>
        <div class="field"><label>売値 ($)</label><div class="iw"><div class="cb d">$</div><input type="number" id="saleUsd" placeholder="0.00"></div></div>
        <div class="field"><label>仕入れ (￥)</label><div class="iw"><div class="cb y">¥</div><input type="number" id="cost" placeholder="0"></div></div>
        <div class="field"><label>国際送料 (￥)</label><div class="iw"><div class="cb y">¥</div><input type="number" id="shipping" placeholder="0"></div></div>
        <div class="field"><label>経費 (￥)</label><div class="iw"><div class="cb y">¥</div><input type="number" id="other" value="0"></div></div>
      </div>
      <button class="btn-toggle" onclick="toggleBackCalc()">逆算ツールを表示</button>
      <div id="backCalcPanel">
        <label>目標利益 (円)</label>
        <div style="display:flex; gap:10px;"><input type="number" id="targetProfit" value="3000"><button onclick="calcBack()" style="background:var(--main); color:#fff; border:none; padding:10px; border-radius:5px; cursor:pointer;">計算</button></div>
      </div>
    </div>

    <div class="result-box">
      <div class="res-row"><span>売上: <b id="salesJpy">¥0</b></span><span>手数料: <b id="feeJpy">¥0</b></span></div>
      <div id="profit">¥0</div>
      <div style="font-size:14px; opacity:0.7;">利益率: <b id="profitRate">0.0%</b></div>
      <div class="res-actions">
        <button class="btn-save" onclick="saveRecord()">利益を記録</button>
        <button class="btn-reset-top" onclick="resetInputs()">リセット</button>
      </div>
    </div>
  </div>

  <div id="reportPage" class="page">
    <div class="report-hero">
      <div style="font-size:12px; opacity:0.6;">今月の合計利益</div>
      <div id="monthTotal">¥0</div>
      <div class="bar-bg"><div id="goalBar" class="bar-fill"></div></div>
    </div>
    <div id="historyList" style="margin-top:20px;"></div>
    <button onclick="clearAllData()" style="width:100%; background:none; border:none; color:var(--red); font-size:11px; margin-top:30px; cursor:pointer;">全データを削除</button>
  </div>
</div>

<script>
  const ids = ['itemName', 'rate', 'feePercent', 'saleUsd', 'cost', 'shipping', 'other'];
  const inputs = {};
  ids.forEach(id => {
    inputs[id] = document.getElementById(id);
    if(id !== 'itemName') inputs[id].addEventListener('input', calculate);
  });

  let records = JSON.parse(localStorage.getItem('ebay_records') || '[]');
  let goal = parseInt(localStorage.getItem('ebay_goal') || '100000');

  function calculate() {
    const r = parseFloat(inputs.rate.value) || 0;
    const f = parseFloat(inputs.feePercent.value) || 0;
    const s = parseFloat(inputs.saleUsd.value) || 0;
    const c = parseFloat(inputs.cost.value) || 0;
    const sh = parseFloat(inputs.shipping.value) || 0;
    const o = parseFloat(inputs.other.value) || 0;

    const salesJpy = Math.round(s * r);
    const feeJpy = Math.round(salesJpy * (f / 100));
    const profit = salesJpy - feeJpy - c - sh - o;
    const margin = salesJpy > 0 ? ((profit / salesJpy) * 100).toFixed(1) : '0.0';

    document.getElementById('salesJpy').textContent = '¥' + salesJpy.toLocaleString();
    document.getElementById('feeJpy').textContent = '¥' + feeJpy.toLocaleString();
    document.getElementById('rateDisplay').textContent = `¥${r}/$`;
    const pEl = document.getElementById('profit');
    pEl.textContent = '¥' + profit.toLocaleString();
    pEl.style.color = profit >= 0 ? 'var(--green)' : 'var(--red)';
    document.getElementById('profitRate').textContent = margin + '%';
    return { itemName: inputs.itemName.value || '未設定', profit, salesJpy, date: new Date().toLocaleDateString() };
  }

  function saveRecord() {
    records.unshift(calculate());
    localStorage.setItem('ebay_records', JSON.stringify(records));
    showToast('記録しました');
  }

  function resetInputs() {
    ['itemName', 'saleUsd', 'cost', 'shipping'].forEach(id => inputs[id].value = '');
    calculate();
  }

  function switchTab(pageId) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(pageId).classList.add('active');
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.getElementById('tab-' + (pageId === 'calcPage' ? 'calc' : 'report')).classList.add('active');
    if(pageId === 'reportPage') updateReport();
  }

  function updateReport() {
    const total = records.reduce((sum, r) => sum + r.profit, 0);
    document.getElementById('monthTotal').textContent = '¥' + total.toLocaleString();
    const prog = Math.min(100, Math.max(0, (total / goal) * 100));
    document.getElementById('goalBar').style.width = prog + '%';
    const list = document.getElementById('historyList');
    list.innerHTML = '';
    records.forEach((r, idx) => {
      const div = document.createElement('div');
      div.className = 'hist-card';
      div.innerHTML = `<div><b>${r.itemName}</b><br><small>${r.date}</small></div><b style="color:${r.profit >= 0 ? 'var(--green)' : 'var(--red)'}">¥${r.profit.toLocaleString()}</b>`;
      list.appendChild(div);
    });
  }

  function toggleBackCalc() {
    const p = document.getElementById('backCalcPanel');
    p.style.display = p.style.display === 'block' ? 'none' : 'block';
  }

  function calcBack() {
    const target = parseFloat(document.getElementById('targetProfit').value) || 0;
    const r = parseFloat(inputs.rate.value) || 0;
    const f = parseFloat(inputs.feePercent.value) || 0;
    const c = parseFloat(inputs.cost.value) || 0;
    const sh = parseFloat(inputs.shipping.value) || 0;
    const o = parseFloat(inputs.other.value) || 0;
    const requiredSalesJpy = (target + c + sh + o) / (1 - (f/100));
    inputs.saleUsd.value = (requiredSalesJpy / r).toFixed(2);
    calculate();
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.style.display = 'block';
    setTimeout(() => t.style.display = 'none', 2000);
  }

  function clearAllData() {
    if(confirm('すべて消去しますか？')) { records = []; localStorage.removeItem('ebay_records'); updateReport(); }
  }
</script>
</body>
</html>
