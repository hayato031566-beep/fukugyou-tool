<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>eBay利益で、デルベイ！</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #fdfaf5; --card: #ffffff; --main: #c0593a; --sub: #5c5248;
      --green: #2a7048; --red: #b03838; --border: #e8e4dc;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Inter', 'Hiragino Kaku Gothic ProN', sans-serif; }
    body { margin: 0; background: var(--bg); color: var(--sub); padding-bottom: 50px; }
    
    /* Header */
    .header { background: var(--card); padding: 15px; border-bottom: 2px solid var(--main); text-align: center; }
    .header h1 { margin: 0; font-size: 18px; color: var(--main); letter-spacing: 1px; }

    .container { max-width: 450px; margin: 0 auto; padding: 20px; }
    .card { background: var(--card); border-radius: 15px; padding: 20px; border: 1px solid var(--border); margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
    
    label { font-size: 12px; font-weight: 600; color: #888; display: block; margin-bottom: 8px; }
    .input-group { position: relative; margin-bottom: 15px; }
    .unit { position: absolute; right: 12px; top: 10px; color: #bbb; font-size: 14px; }
    input { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 16px; background: #fafafa; }
    input:focus { border-color: var(--main); outline: none; background: #fff; }

    /* Result */
    .result-box { background: #1a1714; color: #fff; border-radius: 15px; padding: 25px; text-align: center; transition: 0.3s; }
    .result-label { font-size: 11px; opacity: 0.6; margin-bottom: 5px; }
    #profit { font-size: 42px; font-weight: 600; margin-bottom: 5px; }
    .pos { color: #6ddbaa; } .neg { color: #ff8c8c; }
    .rate { font-size: 14px; opacity: 0.8; }

    /* Buttons */
    .btn-main { width: 100%; background: var(--main); color: #fff; border: none; padding: 15px; border-radius: 10px; font-weight: 600; font-size: 16px; margin-top: 10px; cursor: pointer; }
    .btn-sub { width: 100%; background: none; border: 1px dashed var(--border); color: #888; padding: 10px; border-radius: 10px; font-size: 12px; margin-top: 15px; cursor: pointer; }
    .quick-btns { display: flex; gap: 8px; margin-top: 5px; }
    .q-btn { flex: 1; background: #eee; border: none; padding: 8px; border-radius: 5px; font-size: 11px; cursor: pointer; }
  </style>
</head>
<body>

<div class="header">
  <h1>eBay利益で、デルベイ！</h1>
</div>

<div class="container">
  <div class="card">
    <label>商品メモ</label>
    <div class="input-group">
      <input type="text" id="itemName" placeholder="例: Game Console, Anime Figure">
    </div>

    <div style="display: flex; gap: 15px;">
      <div style="flex: 1;">
        <label>為替レート</label>
        <div class="input-group">
          <input type="number" id="rate" value="150">
          <span class="unit">円/$</span>
        </div>
      </div>
      <div style="flex: 1;">
        <label>eBay手数料</label>
        <div class="input-group">
          <input type="number" id="feePercent" value="15">
          <span class="unit">%</span>
        </div>
      </div>
    </div>

    <label>販売価格</label>
    <div class="input-group">
      <input type="number" id="saleUsd" placeholder="0.00">
      <span class="unit">$</span>
    </div>

    <label>仕入れ値</label>
    <div class="input-group">
      <input type="number" id="cost" placeholder="0">
      <span class="unit">円</span>
    </div>

    <label>国際送料</label>
    <div class="input-group">
      <input type="number" id="shippingUsd" placeholder="0.00">
      <span class="unit">$</span>
    </div>
    <div class="quick-btns">
      <button class="q-btn" onclick="setShip(20)">FedEx $20</button>
      <button class="q-btn" onclick="setShip(35)">EMS $35</button>
    </div>
  </div>

  <div class="result-box">
    <div class="result-label">今回の純利益</div>
    <div id="profit">¥0</div>
    <div class="rate">利益率: <span id="profitRate">0%</span></div>
  </div>

  <button class="btn-main" onclick="calcBack()">【逆算】目標から売値を出す</button>
  <button class="btn-sub" onclick="resetAll()">すべてリセット</button>
</div>

<script>
  const inputs = ['itemName', 'rate', 'feePercent', 'saleUsd', 'cost', 'shippingUsd'];
  const el = {};
  inputs.forEach(id => el[id] = document.getElementById(id));

  function setShip(v) { el.shippingUsd.value = v; calc(); }

  function calc() {
    const r = parseFloat(el.rate.value) || 0;
    const f = (parseFloat(el.feePercent.value) || 0) / 100;
    const s = parseFloat(el.saleUsd.value) || 0;
    const c = parseFloat(el.cost.value) || 0;
    const sh = parseFloat(el.shippingUsd.value) || 0;

    const saleJpy = s * r;
    const shipJpy = sh * r;
    const feeJpy = saleJpy * f;
    const profit = saleJpy - (c + shipJpy + feeJpy);
    const pRate = saleJpy > 0 ? (profit / saleJpy) * 100 : 0;

    const pEl = document.getElementById('profit');
    pEl.textContent = (profit >= 0 ? '¥' : '-¥') + Math.abs(Math.round(profit)).toLocaleString();
    pEl.className = profit >= 0 ? 'pos' : 'neg';
    document.getElementById('profitRate').textContent = Math.round(pRate) + '%';
  }

  function calcBack() {
    const target = prompt("目標利益（円）を入力してください", "3000") || 0;
    const r = parseFloat(el.rate.value) || 0;
    const f = (parseFloat(el.feePercent.value) || 0) / 100;
    const c = parseFloat(el.cost.value) || 0;
    const sh = parseFloat(el.shippingUsd.value) || 0;

    if (r > 0) {
      const neededUsd = (parseFloat(target) + c) / (r * (1 - f)) + sh;
      el.saleUsd.value = Math.ceil(neededUsd);
      calc();
      alert("目標利益を出すための売値をセットしました！");
    }
  }

  function resetAll() {
    inputs.forEach(id => { if(id !== 'rate' && id !== 'feePercent') el[id].value = ''; });
    calc();
  }

  inputs.forEach(id => el[id].addEventListener('input', calc));
</script>

</body>
</html>
