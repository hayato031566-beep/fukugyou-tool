<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>eBay利益計算 PRO</title>
    <style>
        :root {
            --ebay-blue: #0064d2;
            --bg-color: #f0f4f8;
            --text-dark: #1e293b;
        }

        /* 横はみ出しを絶対防ぐ設定 */
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0;
            -webkit-tap-highlight-color: transparent; 
        }
        
        html, body {
            overflow-x: hidden; /* 横スクロールを禁止 */
            width: 100%;
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            display: flex;
            justify-content: center;
            padding: 15px; /* 外側の余白 */
        }

        .container {
            width: 100%;
            max-width: 400px; /* 少しスリムにして余裕を持たせる */
            background: #ffffff;
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border-top: 8px solid var(--ebay-blue);
        }

        h1 { font-size: 20px; text-align: center; margin-bottom: 5px; }
        .tagline { text-align: center; font-size: 12px; color: #64748b; margin-bottom: 20px; }

        /* 為替ボックス */
        .exchange-box {
            background: #f8fafc;
            border-radius: 12px;
            padding: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            border: 1px solid #e2e8f0;
        }
        .exchange-box label { font-size: 11px; font-weight: bold; }
        .exchange-box input { width: 60px; border: none; background: transparent; font-size: 16px; font-weight: bold; color: var(--ebay-blue); text-align: right; outline: none; }

        /* 入力エリア */
        .input-row { 
            display: flex; 
            gap: 10px; 
            margin-bottom: 12px; 
            width: 100%;
        }
        .input-group { flex: 1; min-width: 0; } /* min-width: 0 がはみ出し防止のコツ */

        label { display: block; font-size: 11px; font-weight: 600; margin-bottom: 5px; color: #475569; }
        
        input[type="number"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
            -moz-appearance: textfield;
        }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; }

        /* 結果表示 */
        .result-panel {
            background: #1e293b;
            color: white;
            border-radius: 18px;
            padding: 20px;
            margin-top: 20px;
            text-align: center;
        }
        .main-profit span { font-size: 12px; color: #94a3b8; }
        .main-profit h2 { font-size: 28px; margin: 5px 0; }

        .sub-results {
            display: flex;
            justify-content: space-between;
            border-top: 1px solid #334155;
            padding-top: 15px;
            margin-top: 15px;
        }
        .sub-item { flex: 1; }
        .sub-item label { color: #94a3b8; font-size: 10px; }
        .sub-item div { font-size: 16px; font-weight: bold; }

        .footer { text-align: center; margin-top: 20px; font-size: 11px; color: #94a3b8; }
    </style>
</head>
<body>

<div class="container">
    <h1>🚢 eBay 利益計算 PRO</h1>
    <p class="tagline">ドル売上を爆速で円換算</p>

    <div class="exchange-box">
        <label>為替レート (1ドル)</label>
        <div>
            <input type="number" id="rate" value="150" oninput="calc()"> 円
        </div>
    </div>

    <div class="input-row">
        <div class="input-group">
            <label>売価 ($)</label>
            <input type="number" id="usd_price" placeholder="100" oninput="calc()">
        </div>
        <div class="input-group">
            <label>仕入れ (円)</label>
            <input type="number" id="jpy_cost" placeholder="8000" oninput="calc()">
        </div>
    </div>

    <div class="input-row">
        <div class="input-group">
            <label>eBay手数料 (%)</label>
            <input type="number" id="fee_per" value="15" oninput="calc()">
        </div>
        <div class="input-group">
            <label>送料 (円)</label>
            <input type="number" id="shipping" placeholder="3000" oninput="calc()">
        </div>
    </div>

    <div class="input-group" style="margin-top: 12px;">
        <label>その他経費 (円)</label>
        <input type="number" id="other" placeholder="0" oninput="calc()">
    </div>

    <div class="result-panel" id="res_panel">
        <div class="main-profit">
            <span>純利益（日本円）</span>
            <h2 id="profit_jpy">¥0</h2>
        </div>
        <div class="sub-results">
            <div class="sub-item">
                <label>売上高</label>
                <div id="sales_jpy">¥0</div>
            </div>
            <div class="sub-item">
                <label>利益率</label>
                <div id="margin">0%</div>
            </div>
        </div>
    </div>

    <div class="footer">© 2026 eBay Profit Tracker</div>
</div>

<script>
    function calc() {
        const rate = parseFloat(document.getElementById('rate').value) || 0;
        const usd = parseFloat(document.getElementById('usd_price').value) || 0;
        const cost = parseFloat(document.getElementById('jpy_cost').value) || 0;
        const feePer = parseFloat(document.getElementById('fee_per').value) || 0;
        const ship = parseFloat(document.getElementById('shipping').value) || 0;
        const other = parseFloat(document.getElementById('other').value) || 0;

        const salesJpy = usd * rate;
        const ebayFee = salesJpy * (feePer / 100);
        const profit = salesJpy - cost - ebayFee - ship - other;
        const margin = salesJpy > 0 ? (profit / salesJpy) * 100 : 0;

        document.getElementById('sales_jpy').innerText = "¥" + Math.floor(salesJpy).toLocaleString();
        document.getElementById('profit_jpy').innerText = "¥" + Math.floor(profit).toLocaleString();
        document.getElementById('margin').innerText = margin.toFixed(1) + "%";

        document.getElementById('res_panel').style.background = profit < 0 ? "#e53238" : "#1e293b";
    }
</script>

</body>
</html>
